<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Calculator</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <main class="calculator">

        <h1>Renal Cancer Calculator</h1>

        <label for="localization">Localization</label>
        <select id="localization"></select>

        <label for="tumorGrade">Tumor Grade</label>
        <select id="tumorGrade"></select>

        <label for="tnmStage">TNM Stage</label>
        <select id="tnmStage"></select>

        <label for="nStage">N Stage</label>
        <select id="nStage"></select>

        <label for="age">Age</label>
        <input
            id="age"
            type="number"
            placeholder="Age"
        >

        <label for="sarcomDiff">Sarcomatoidal Difference</label>
        <input
            id="sarcomDiff"
            type="number"
            step="any"
            min="0"
            max="1"
            placeholder="between 0 and 1"
        >

        <button id="submit">
            Submit
        </button>

        <p id="error"></p>

        <p id="result"></p>

    </main>

    <script src="app.js" type="module"></script>

</body>
</html>
