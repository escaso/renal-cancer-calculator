<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ccRCC-CSS Tree</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/ios-180.png">
    <link rel="icon" href="icons/icon-192.png">
</head>
<body>
    <header>
        <img src="icons/ios-180.png" alt="">
        Renal Cancer Calculator
    </header>

    <main>
        <h1>ccRCC-CSS Tree</h1>

        <label>Localization <select id="localization"></select></label>
        <label>Tumor grade <select id="tumorGrade"></select></label>
        <label>T stage <select id="tStage"></select></label>
        <label>N stage <select id="nStage"></select></label>
        <label>Sarcomatoid differentiation <select id="sarcomDiff"></select></label>
        <label>Age <input id="age" type="number" min="0" max="120"></label>

        <button id="submit">Calculate</button>
        <p id="error" role="alert"></p>
    </main>

    <dialog id="result">
        <div id="resultContent"></div>
        <form method="dialog"><button>Close</button></form>
    </dialog>

    <footer>
        <p>Decision Tree model: Laura Martínez Cayuelas</p>
        <p>Software development: Estrella Cayuelas Solano</p>
        <p>For research use only. Not a substitute for clinical judgment.</p>
    </footer>
    <script src="app.js" type="module"></script>
</body>
</html>
