<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Calculator</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <main class="calculator">

        <h1>Renal Cancer Calculator</h1>

        <select id="Localization"></select>

        <select id="Tumor Grade"></select>

        <select id="TNM Stage"></select>

        <input
            id="Age"
            type="number"
            placeholder="Age"
        >

        <input
            id="Sarcomatoidal Diff"
            type="number"
            step="any"
            min="0"
            max="1"
            placeholder="Sarcomatoidal Diff (between 0 and 1)"
        >

        <button id="submit">
            Submit
        </button>

        <p id="error"></p>

        <p id="result"></p>

    </main>

    <script src="app.js"></script>

</body>
</html>
