<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Calculator</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <main class="calculator">

        <h1>My Calculator</h1>

        <input
            id="value1"
            type="number"
            placeholder="Value 1"
        >

        <input
            id="value2"
            type="number"
            placeholder="Value 2"
        >

        <input
            id="value3"
            type="number"
            placeholder="Value 3"
        >

        <button id="submit">
            Submit
        </button>

        <p id="error"></p>

        <p id="result"></p>

    </main>

    <script src="app.js"></script>

</body>
</html>
