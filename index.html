<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ccRCC-CSS Tree</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="/renal-cancer-calculator/icons/ios-180.png">
</head>
<body>
    <main>
        <h1>ccRCC-CSS Tree</h1>

        <label>Localization <select id="localization"></select></label>
        <label>Tumor grade <select id="tumorGrade"></select></label>
        <label>T stage <select id="tStage"></select></label>
        <label>N stage <select id="nStage"></select></label>
        <label>Sarcomatoid differentiation <select id="sarcomDiff"></select></label>
        <label>Age <input id="age" type="number" min="0" max="120"></label>

        <button id="submit">Calculate</button>
        <p id="error" role="alert"></p>
        <div id="result"></div>

        <p class="note">For research use only. Not a substitute for clinical judgment.</p>
    </main>
    <script src="app.js" type="module"></script>
</body>
</html>
