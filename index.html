<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ccRCC-CSS Tree</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="/renal-cancer-calculator/icons/ios-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@600&display=swap" rel="stylesheet">
</head>

<body>

    <header class="site-header">
        <div class="header-inner">
            <img class="header-logo" src="/renal-cancer-calculator/icons/ios-180.png" alt="App icon" onerror="this.style.display='none'">
            <span class="header-title">Renal Cancer Calculator</span>
        </div>
    </header>


    <main class="calculator">

        <div class="form-card">
            <h1>Risk Group Assessment</h1>
            <p class="subtitle">Complete all fields to calculate the patient's prognostic group.</p>

        <div class="field-group">
                <label for="localization">Localization</label>
                <select id="localization"></select>
            </div>
 
            <div class="field-group">
                <label for="tumorGrade">Tumor Grade</label>
                <select id="tumorGrade"></select>
            </div>
 
            <div class="field-group">
                <label for="tStage">T Stage</label>
                <select id="tStage"></select>
            </div>
 
            <div class="field-group">
                <label for="nStage">N Stage</label>
                <select id="nStage"></select>
            </div>
 
            <div class="field-group">
                <label for="sarcomDiff">Sarcomatoidal Differentiation</label>
                <select id="sarcomDiff"></select>
            </div>
 
            <div class="field-group">
                <label for="age">Age</label>
                <input
                    id="age"
                    type="number"
                    placeholder="Enter patient age"
                    min="0"
                    max="120"
                >
            </div>

            <p id="error" role="alert"></p>
 
            <button id="submit">Calculate Risk Group</button>
 
            <p id="result"></p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <p class="footer-text">Your institution or disclaimer text goes here.</p>
        </div>
    </footer>

    <script src="app.js" type="module"></script>

</body>
</html>
